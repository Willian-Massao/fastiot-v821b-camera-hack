# ====================================================================
# Open-IPCam Configuration File (V821B Allwinner RISC-V 32)
# 100% Local, Zero-Cloud, Home Assistant Native
# ====================================================================

# Web Server & REST API Port
http_port=8080

# RTSP Streaming Port (0 = native hardware RTSP stream on port 554)
rtsp_port=0

# RTSP Stream Paths (FastIoT native RTSP server)
rtsp_main_path=/live/camid_0/main
rtsp_sub_path=/live/camid_0/sub
rtsp_user=admin
rtsp_pass=Ztac@2021

# Motor PTZ Configuration
# Speed: 1 (slow) to 10 (fast), default: 5
motor_speed=5
# Steps per single tap (default: 100)
motor_step=100

# Home Assistant MQTT Auto-Discovery
# Set mqtt_enabled=true and specify your Home Assistant MQTT broker IP
mqtt_enabled=false
mqtt_broker=192.168.15.100
mqtt_port=1883
mqtt_user=
mqtt_pass=
